name: my_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4

  file_picker: ^10.3.8
  emoji_picker_flutter: ^4.4.0
  cloud_firestore: ^6.2.0
  http: ^1.2.2
  shared_preferences: ^2.3.3

  # PDF report export
  pdf: ^3.11.1
  printing: ^5.13.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 👇 ADD THIS
  flutter_launcher_icons: ^0.13.1

# Launcher icon generation. Run `dart run flutter_launcher_icons` after editing.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/icon_foreground.png